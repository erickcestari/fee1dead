# fee1dead per-run config. Paths are container paths.

[run]
target_dir   = "/work/target"
scratch_root = "/work/scratch"
out_dir      = "/work/out"
# Max agents running at once (hunters, review batches).
concurrency  = 10
agent_timeout_secs = 1800
# Delay between hunter launches. Forked hunters all replay recon's session as
# their first request; a simultaneous burst gets rate limited. 0 disables.
hunter_stagger_ms = 750
# Fork hunters from recon's session (a cached prefix) instead of handing each
# one recon.json. Whether it pays off is target-dependent: compare cost vs
# confirmed findings in out_dir/logs.
fork_hunters = true
# Hunters compile and run PoCs. Off by default: it is the most token-hungry
# part of hunting.
require_poc = false
# Your skills, one <name>/SKILL.md each; `just` mounts ./skills here, where
# claude-code loads them. Agents use none when it is unset or empty.
skills_dir = "/home/agent/.claude/skills"
# Lead-less hunts over the largest modules no recon task scopes, so code
# outside recon's threat model still gets a look. Each costs a hunter.
wildcard_tasks = 1

# Clone the target instead of mounting it. The git host must be in
# [firewall].allow. Omit to use a mounted target_dir.
# [target]
# repo = "https://github.com/org/name.git"
# ref  = "main"
# Run in target_dir before any stage, behind the firewall. A failure warns.
# prepare = ["go mod download"]
# Bash script run as root before the firewall, with open egress. A failing
# line stops the run. See README "Set up the target's environment".
# setup = '''
# apt-get update && apt-get install -y --no-install-recommends protobuf-compiler
# go mod download
# go build ./...
# '''

# A spec or known-good implementation the agents treat as ground truth. The
# git host must be in [firewall].allow.
# [reference]
# repo = "https://github.com/lightning/bolts.git"
# ref  = "master"
# dir  = "/work/reference"

[provider]
# A [providers.*] block below.
default = "claude-code"

[providers.claude-code]
type       = "claude-code"
model      = "claude-opus-5"
extra_args = ["--dangerously-skip-permissions"]
# Stop starting agents at this weekly usage %. Subscription auth only.
# max_weekly_usage_pct = 80

[providers.opencode]
type    = "opencode"
# provider/model form; `opencode models` lists them.
model   = "anthropic/claude-opus-5"
# agent   = "build"
# variant = "high"
auto    = true
extra_args = []

# Any other CLI, no Rust needed.
# [providers.codex]
# type    = "exec"
# command = "codex"
# args    = ["exec", "--cd", "{working_dir}", "{prompt}"]
# output  = "json"

[firewall]
# Default-deny egress; only these hosts are reachable.
allow = [
  "api.anthropic.com",
  "registry.npmjs.org",
  "static.crates.io",
  "index.crates.io",
  # opencode also needs:
  # "models.dev",
  # "opencode.ai",
  # [target].repo / [reference] / github sink:
  # "github.com",
  # "codeload.github.com",
  # "api.github.com",
]

[report]
sink = "sqlite"            # sqlite | jsonl | http | github
path = "/work/out/findings.db"
# sink      = "http"
# url       = "https://ingest.example.com/findings"
# token_env = "INGEST_TOKEN"
# sink      = "github"
# repo      = "owner/name"
# token_env = "GITHUB_PAT"

[feedback]
max_seeds = 200
max_ruled_out = 300

[stages]
# Run in order; a stage may repeat (hunt again after gapfill). Add "critic"
# before "gapfill" to queue attack surface the first hunt pass missed.
enabled = ["recon", "hunt", "gapfill", "hunt", "dedupe", "skip-reported", "validate", "report", "feedback", "aggregate"]

# Per-stage model; unset stages use the provider's model. Keep hunt and recon
# on one model so forks reuse recon's cache.
# [stages.models]
# validate      = "claude-opus-5"
# skip-reported = "claude-haiku-4-5"
