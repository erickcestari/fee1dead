# fee1dead harness — per-run configuration.
# Paths are container paths; mount your target repo at run.target_dir.

[run]
target_dir   = "/work/target"
scratch_root = "/work/scratch"
out_dir      = "/work/out"
# Max hunters running at once.
concurrency  =10
# Per-agent wall-clock timeout.
agent_timeout_secs = 1800
# Cap on a hunter's agent turns. Cost scales with turns (each re-reads the whole
# cached context), and a few runaway hunters dominate spend; this bounds the
# worst case. Set very high to effectively disable. Only claude-code enforces it.
hunter_max_turns = 60
# Cap on recon's agent turns. Recon orients (structure-first) and emits the
# threat model; it should not read the whole repo. Every turn re-reads recon's
# growing context, which is then replayed into every forked hunter, so an
# unbounded recon dominates a run's cost. Keeping recon compact also holds its
# context under the long-context pricing tier. Only claude-code enforces it.
recon_max_turns = 30
# Delay between launching consecutive hunters, in milliseconds. Each forked
# hunter replays recon's (large) session as its first request; releasing the
# whole concurrency batch at once fires that burst simultaneously and the API
# rejects it with server-side rate limiting. Staggering spreads the first
# requests out. Set to 0 to disable.
hunter_stagger_ms = 750
# Fork each hunter from the recon agent's session so it inherits recon's
# codebase context instead of re-injecting the architecture doc into every
# hunter prompt. Only the claude-code provider supports this. Forks share
# recon's history as a cached prefix (cache-read rates) when hunters start
# within the cache window. Set false to opt out.
#
# Now that recon orients shallow (recon_max_turns), the shared prefix is mostly
# the threat model + orient output rather than deep file reads, so forking's edge
# over cold hunters (which read only their per-task targets) is an empirical call.
# A/B both on your target: each agent's stream log records its cost/usage, so
# compare total cost vs confirmed findings from the logs dir.
fork_hunters = true
# Whether hunters write, compile, and run proof-of-concept code to confirm
# findings. This is the most token-hungry part of hunting, so it is off by
# default: hunters substantiate by close reading instead (cheaper, but weaker
# confirmation). Set true to have hunters produce runnable PoCs at higher cost.
require_poc = false
# Whether agents may use the vendored Trail of Bits skills. On by default. Set
# false to tell every stage to ignore the skills and rely on its own analysis
# (recon then emits no suggested_skills) — useful to isolate the skills' effect
# on token cost and bug yield, or for a target the skills don't fit.
use_skills = true

# Optional: clone the target into run.target_dir at startup instead of mounting
# it. The git host MUST be in [firewall].allow (the clone runs after the
# firewall comes up). Omit this section to use a mounted target_dir.
# [target]
# repo = "https://github.com/org/name.git"
# ref  = "main"        # branch, tag, or commit SHA; defaults to the default branch

# Optional: clone a reference repository — a spec or known-good implementation —
# and expose it to the recon, hunt, and validate agents as ground truth (it is
# added to their readable dirs and pointed to in their prompts). Useful for
# spec-to-code compliance, e.g. the BOLT specs for a Lightning implementation.
# The git host MUST be in [firewall].allow. Omit this section to disable.
# [reference]
# repo = "https://github.com/lightning/bolts.git"
# ref  = "master"          # branch, tag, or commit SHA; defaults to the default branch
# dir  = "/work/reference" # where to clone it (a path the agents can read)

[provider]
# Which [providers.*] block to use. Only "claude-code" is implemented as a
# built-in adapter today; others are added via type = "exec" (zero code).
default = "claude-code"

[providers.claude-code]
type       = "claude-code"
model      = "claude-opus-4-8"
# The container is the security boundary, so the agent runs unrestricted.
extra_args = ["--dangerously-skip-permissions"]

# Example: add any other CLI with no Rust changes. {prompt} and {working_dir}
# are substituted per task.
# [providers.codex]
# type    = "exec"
# command = "codex"
# args    = ["exec", "--cd", "{working_dir}", "{prompt}"]
# output  = "json"

[firewall]
# Default-deny egress; only these hosts are reachable (see docker/init-firewall.sh).
# Add the package registries your target's PoC toolchain needs.
allow = [
  "api.anthropic.com",
  "registry.npmjs.org",
  "static.crates.io",
  "index.crates.io",
  # Add your git host here when using [target].repo, e.g.:
  # "github.com",
  # "codeload.github.com",
]

[report]
sink = "sqlite"            # sqlite | jsonl | http | github
path = "/work/out/findings.db"
# For the http sink instead:
# sink      = "http"
# url       = "https://ingest.example.com/findings"
# token_env = "INGEST_TOKEN"   # bearer token read from this env var
# To open one GitHub issue per finding instead:
# sink      = "github"
# repo      = "owner/name"     # issues are filed here
# token_env = "GITHUB_PAT"     # PAT env var (issues:write); defaults to GITHUB_PAT
# The github sink needs api.github.com in [firewall].allow.
# Before filing, new findings are deduped against issues already filed: a
# token-overlap score decides the clear cases, and only ambiguous pairs go to a
# lightweight judge model (defaults to claude-haiku-4-5; override below).
# dedupe_model = "claude-haiku-4-5"

# Cross-run feedback memory (see [stages] "feedback").
[feedback]
# Cap on seeds carried between runs, so the memory stays bounded.
max_seeds = 200

[stages]
# Stages run in the listed order; a stage name may repeat. To exploit gapfill,
# run hunt again after it, e.g.:
#   ["recon", "hunt", "gapfill", "hunt", "dedupe", "skip-reported", "aggregate", "validate", "report", "feedback"]
# skip-reported drops candidates already reported in the sink (e.g. filed as
# GitHub issues) BEFORE validate, so no validation tokens are spent re-reviewing
# findings a past run already surfaced. It is a no-op unless report.sink tracks
# external state (the github sink), so it is safe to leave in the list.
# feedback runs last: it distils this run into feedback-seeds.jsonl, which the
# next run's recon merges back into the queue. Keep the same out_dir to retain
# that memory across runs.
enabled = ["recon", "hunt", "gapfill", "hunt", "dedupe", "skip-reported", "aggregate", "validate", "report", "feedback"]
