[package]
name = "fee1dead"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fee1dead"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
jsonschema = "0.18"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }
libc = "0.2"

[features]
mock-runner = []

[dev-dependencies]
tempfile = "3"
