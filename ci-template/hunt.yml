# Scheduled hunt. Lives in a separate results repo: builds fee1dead, runs it in
# clone mode, and commits each run's output under runs/.
#
# Secrets: FEE1DEAD_PAT (read access to the fee1dead repo), and
#   CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY.
# Variables: FEE1DEAD_REPO (owner/name), FEE1DEAD_REF (default main).

name: hunt

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      config:
        description: "Harness config to run (path in THIS runs repo)"
        required: false
        default: "config/target.toml"

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      CONFIG: ${{ github.event.inputs.config || 'config/target.toml' }}
    steps:
      - name: Checkout results repo
        uses: actions/checkout@v4

      - name: Checkout fee1dead source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FEE1DEAD_REPO }}
          ref: ${{ vars.FEE1DEAD_REF || 'main' }}
          token: ${{ secrets.FEE1DEAD_PAT }}
          path: fee1dead

      - name: Resolve fee1dead commit
        id: sha
        run: echo "sha=$(git -C fee1dead rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache harness image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/fee1dead-image.tar
          key: fee1dead-image-${{ steps.sha.outputs.sha }}

      - name: Load cached image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/fee1dead-image.tar

      - name: Build image
        if: steps.image-cache.outputs.cache-hit != 'true'
        working-directory: fee1dead
        run: |
          docker build -t fee1dead:local \
            --build-arg HOST_UID="$(id -u)" \
            --build-arg HOST_GID="$(id -g)" \
            --build-arg FEE1DEAD_SHA="${{ steps.sha.outputs.sha }}" \
            -f docker/Dockerfile .
          docker save fee1dead:local -o /tmp/fee1dead-image.tar

      - name: Run pipeline (clone mode)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # A missing file would be bind-mounted as an empty dir.
          if [ ! -f "$CONFIG" ]; then
            echo "config not found: $CONFIG (relative to the runs repo root)"
            exit 1
          fi
          RUN_DIR="runs/$(date -u +%Y%m%d-%H%M%S)-${{ github.run_id }}"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          mkdir -p "$RUN_DIR"
          # Carry the feedback memory forward from the latest run.
          LAST_SEEDS="$(ls -1 runs/*/feedback-seeds.jsonl 2>/dev/null | tail -n1 || true)"
          if [ -n "$LAST_SEEDS" ]; then
            cp "$LAST_SEEDS" "$RUN_DIR/feedback-seeds.jsonl"
            echo "seeded feedback memory from $LAST_SEEDS"
          fi
          docker run --rm \
            --cap-add=NET_ADMIN \
            -e CLAUDE_CODE_OAUTH_TOKEN \
            -e ANTHROPIC_API_KEY \
            -v "$PWD/$RUN_DIR":/work/out \
            -v "$PWD/$CONFIG":/opt/fee1dead/config/harness.toml:ro \
            fee1dead:local

      - name: Commit this run's output
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" runs
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -Af "$RUN_DIR"
          if git diff --cached --quiet; then
            echo "no output to commit"
            exit 0
          fi
          git commit -m "hunt: run ${{ github.run_id }} (${CONFIG})"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
